---

- name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok"
  when:
    - ubtu24cis_rule_5_3_3_4_1
    - ubtu24cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.4.1
    - NIST800-53R5_NA
    - pam
  block:
    - name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok | capture state"
      ansible.builtin.shell: |
        set -o pipefail
        grep -E "pam_unix.so.*nullok" /etc/pam.d/common-{password,auth,account,session,session-noninteractive} /usr/share/pam-configs/* | cut -d ':' -f1 | uniq
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_pam_nullok.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_pam_nullok

    - name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok | Ensure nullok removed"
      when: discovered_pam_nullok.stdout | length > 0
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: nullok
        replace: ''
      loop: "{{ discovered_pam_nullok.stdout_lines }}"
      loop_control:
        label: "{{ item }}"
      notify: Pam_auth_update_pwunix

- name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember"
  when: ubtu24cis_rule_5_3_3_4_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - pam
    - rule_5.3.3.4.2
    - NIST800-53R5_NA
  block:
    - name: "5.3.3.4.2 | AUDIT | Ensure pam_unix does not include remember | capture state"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Pl -- '^\h*([^#\n\r]+\h+)?pam_unix\.so\h+([^#\n\r]+\h+)?remember\b' /usr/share/pam-configs/*
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_pam_remember.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_pam_remember

    - name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember | Ensure remember removed"
      when: discovered_pam_remember.stdout | length > 0
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^([^#\n]*\bpam_unix\.so\b[^#\n]*?)[ \t]+remember(=\S*)?(?=[ \t]|$)'
        replace: '\1'
      loop: "{{ discovered_pam_remember.stdout_lines }}"
      loop_control:
        label: "{{ item }}"

    - name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember | Update pam for edited profiles"
      when: discovered_pam_remember.stdout | length > 0
      ansible.builtin.command: pam-auth-update --enable {{ item | basename }}
      changed_when: true
      loop: "{{ discovered_pam_remember.stdout_lines }}"
      loop_control:
        label: "{{ item | basename }}"

- name: "5.3.3.4.3/4 | AUDIT | Capture pam_unix pam-configs profile"
  when: ubtu24cis_rule_5_3_3_4_3 or
        ubtu24cis_rule_5_3_3_4_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - pam
    - rule_5.3.3.4.3
    - rule_5.3.3.4.4
    - NIST800-53R5_IA-5
  ansible.builtin.stat:
    path: "/{{ ubtu24cis_pam_confd_dir }}{{ ubtu24cis_pam_pwunix_file }}"
  register: discovered_pam_pwunix_profile

- name: "5.3.3.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm"
  when:
    - ubtu24cis_rule_5_3_3_4_3
    - discovered_pam_pwunix_profile.stat.exists
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - pam
    - rule_5.3.3.4.3
    - NIST800-53R5_IA-5
  ansible.builtin.replace:
    path: "/{{ ubtu24cis_pam_confd_dir }}{{ ubtu24cis_pam_pwunix_file }}"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - regexp: '(?<=[ \t])(?!{{ ubtu24cis_passwd_hash_algo }}(?=[ \t]|$))(?:md5|bigcrypt|sha256|blowfish|gost_yescrypt|sha512|yescrypt)(?=[ \t]|$)'
      replace: '{{ ubtu24cis_passwd_hash_algo }}'
    - regexp: '^((?:Password|Password-Initial):[ \t]*\n[ \t]+[^#\n]*\bpam_unix\.so\b(?![^#\n]*[ \t](?:md5|bigcrypt|sha256|blowfish|gost_yescrypt|sha512|yescrypt)(?=[ \t]|$))[^#\n]*?)[ \t]*$'
      replace: '\1 {{ ubtu24cis_passwd_hash_algo }}'
  notify: Pam_auth_update_pwunix

- name: "5.3.3.4.4 | PATCH | Ensure pam_unix includes use_authtok"
  when:
    - ubtu24cis_rule_5_3_3_4_4
    - discovered_pam_pwunix_profile.stat.exists
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - pam
    - rule_5.3.3.4.4
    - NIST800-53R5_IA-5
  ansible.builtin.replace:
    path: "/{{ ubtu24cis_pam_confd_dir }}{{ ubtu24cis_pam_pwunix_file }}"
    regexp: '^(Password:[ \t]*\n[ \t]+[^#\n]*\bpam_unix\.so\b(?![^#\n]*[ \t]use_authtok(?=[ \t]|$))[^#\n]*?)[ \t]*$'
    replace: '\1 use_authtok'
  notify: Pam_auth_update_pwunix
