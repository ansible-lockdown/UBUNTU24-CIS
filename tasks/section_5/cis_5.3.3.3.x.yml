---

- name: "5.3.3.3.1/2/3 | AUDIT | Capture pam_pwhistory pam-configs profile"
  when:
    - ubtu24cis_rule_5_3_3_3_1 or
      ubtu24cis_rule_5_3_3_3_2 or
      ubtu24cis_rule_5_3_3_3_3
    - ubtu24cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.3.1
    - rule_5.3.3.3.2
    - rule_5.3.3.3.3
    - NIST800-53R5_IA-5
    - pam
  ansible.builtin.stat:
    path: "/{{ ubtu24cis_pam_confd_dir }}{{ ubtu24cis_pam_pwhistory_file }}"
  register: discovered_pam_pwhistory_profile

- name: "5.3.3.3.1 | PATCH | Ensure password history remember is configured"
  when:
    - ubtu24cis_rule_5_3_3_3_1
    - ubtu24cis_disruption_high
    - discovered_pam_pwhistory_profile.stat.exists
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.3.1
    - NIST800-53R5_IA-5
    - pam
  ansible.builtin.replace:
    path: "/{{ ubtu24cis_pam_confd_dir }}{{ ubtu24cis_pam_pwhistory_file }}"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - regexp: '^([ \t]+[^#\n]*\bpam_pwhistory\.so\b[^#\n]*?[ \t])remember=\d+\b'
      replace: '\g<1>remember={{ ubtu24cis_pamd_pwhistory_remember }}'
    - regexp: '^([ \t]+[^#\n]*\bpam_pwhistory\.so\b(?![^#\n]*[ \t]remember=)[^#\n]*?)[ \t]*$'
      replace: '\1 remember={{ ubtu24cis_pamd_pwhistory_remember }}'
  notify: Pam_auth_update_pwhistory

- name: "5.3.3.3.2 | PATCH | Ensure password history is enforced for the root user"
  when:
    - ubtu24cis_rule_5_3_3_3_2
    - ubtu24cis_disruption_high
    - discovered_pam_pwhistory_profile.stat.exists
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.3.2
    - NIST800-53R5_IA-5
    - pam
  ansible.builtin.replace:
    path: "/{{ ubtu24cis_pam_confd_dir }}{{ ubtu24cis_pam_pwhistory_file }}"
    regexp: '^([ \t]+[^#\n]*\bpam_pwhistory\.so\b(?![^#\n]*[ \t]enforce_for_root\b)[^#\n]*?)[ \t]*$'
    replace: '\1 enforce_for_root'
  notify: Pam_auth_update_pwhistory

- name: "5.3.3.3.3 | PATCH | Ensure pam_pwhistory includes use_authtok"
  when:
    - ubtu24cis_rule_5_3_3_3_3
    - ubtu24cis_disruption_high
    - discovered_pam_pwhistory_profile.stat.exists
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.3.3
    - NIST800-53R5_IA-5
    - pam
  ansible.builtin.replace:
    path: "/{{ ubtu24cis_pam_confd_dir }}{{ ubtu24cis_pam_pwhistory_file }}"
    regexp: '^([ \t]+[^#\n]*\bpam_pwhistory\.so\b(?![^#\n]*[ \t]use_authtok\b)[^#\n]*?)[ \t]*$'
    replace: '\1 use_authtok'
  notify: Pam_auth_update_pwhistory
