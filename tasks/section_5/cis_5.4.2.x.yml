---

- name: "5.4.2.7/8 | AUDIT | Interactive Users"
  when:
    - ubtu24cis_rule_5_4_2_7 or
      ubtu24cis_rule_5_4_2_8
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - shadow_suite
    - rule_5.4.2.7
    - rule_5.4.2.8
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-11
    - NIST800-53R5_MP-2
  ansible.builtin.shell: |
    set -o pipefail
    l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' -))$"
    awk -v pat="$l_valid_shells" -F: '($1 != "root" && $NF ~ pat) {print $1}' /etc/passwd
  args:
    executable: "{{ ubtu24cis_shell_executable }}"
  changed_when: false
  check_mode: false
  register: discovered_interactive_usernames

- name: "5.4.2.1 | AUDIT | Ensure root is the only UID 0 account"
  when: ubtu24cis_rule_5_4_2_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - accounts
    - users
    - rule_5.4.2.1
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
  block:
    - name: "5.4.2.1 | AUDIT | Ensure root is the only UID 0 account | Get accounts other than root with UID 0"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '($3 == 0 && $1 != "root") { print $1 }' /etc/passwd
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_uid_zero_accounts_except_root.rc != 0
      check_mode: false
      register: discovered_uid_zero_accounts_except_root

    - name: "5.4.2.1 | AUDIT | Ensure root is the only UID 0 account | Warning if other accounts have UID 0"
      when: discovered_uid_zero_accounts_except_root.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have accounts other than root with UID 0 - Please resolve"
          - "{{ discovered_uid_zero_accounts_except_root.stdout_lines }}"

    - name: "5.4.2.1 | WARN | Ensure root is the only UID 0 account | warn_count"
      when: discovered_uid_zero_accounts_except_root.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.4.2.1'

- name: "5.4.2.2 | AUDIT | Ensure root is the only GID 0 account"
  when: ubtu24cis_rule_5_4_2_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - rule_5.4.2.2
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - user
    - system
  block:
    - name: "5.4.2.2 | AUDIT | Ensure root is the only GID 0 account | Get members of gid 0"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ && $4=="0") {print $1}' /etc/passwd | grep -wv 'root'
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_gid0_members.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_gid0_members

    - name: "5.4.2.2 | AUDIT | Ensure root is the only GID 0 account | Warning if other accounts have GID 0"
      when: discovered_gid0_members.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have accounts other than root with primary GID 0 - Please resolve"
          - "{{ discovered_gid0_members.stdout_lines }}"

    - name: "5.4.2.2 | WARN | Ensure root is the only GID 0 account | warn_count"
      when: discovered_gid0_members.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.4.2.2'

- name: "5.4.2.3 | AUDIT | Ensure group root is the only GID 0 group"
  when: ubtu24cis_rule_5_4_2_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.2.3
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - user
    - system
  block:
    - name: "5.4.2.3 | AUDIT | Ensure group root is the only GID 0 group | Get groups with gid 0"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '$3=="0"{print $1}' /etc/group | grep -vw 'root'
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      check_mode: false
      changed_when: false
      failed_when: discovered_gid0_groups.rc not in [ 0, 1 ]
      register: discovered_gid0_groups

    - name: "5.4.2.3 | AUDIT | Ensure group root is the only GID 0 group | Warning if others gid 0 groups"
      when:
        - discovered_gid0_groups is defined
        - discovered_gid0_groups.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have other groups assigned to GID 0 - Please resolve"
          - "{{ discovered_gid0_groups.stdout_lines }}"

    - name: "5.4.2.3 | WARN | Ensure group root is the only GID 0 group | warn_count"
      when:
        - discovered_gid0_groups is defined
        - discovered_gid0_groups.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.4.2.3'

- name: "5.4.2.4 | PATCH | Ensure root account access is controlled"
  when: ubtu24cis_rule_5_4_2_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - shadow_suite
    - rule_5.4.2.4
    - NIST800-53R5_NA
  ansible.builtin.debug:
    msg: "This is set as an assert in tasks/main"

- name: "5.4.2.5 | PATCH | Ensure root PATH Integrity"
  when: ubtu24cis_rule_5_4_2_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - paths
    - rule_5.4.2.5
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
  block:
    - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Get root paths"
      ansible.builtin.shell: |
        set -o pipefail
        sudo -Hiu root env | grep '^PATH' | cut -d= -f2
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      check_mode: false
      register: discovered_root_paths

    - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Get root paths"
      when: discovered_root_paths is defined
      ansible.builtin.shell: |
        set -o pipefail
        sudo -Hiu root env | grep '^PATH' | cut -d= -f2 | tr ":" "\n"
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      check_mode: false
      register: discovered_root_paths_split

    - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Set fact"
      when: discovered_root_paths is defined
      ansible.builtin.set_fact:
        root_paths: "{{ discovered_root_paths.stdout }}"

    - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Check for empty dirs"
      when: discovered_root_paths is defined
      ansible.builtin.shell: |
        set -o pipefail
        echo {{ root_paths }} | grep -q "::" && echo "roots path contains a empty directory (::)"
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_root_path_empty_dir.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_root_path_empty_dir

    - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Check for trailing ':'"
      when: discovered_root_paths is defined
      ansible.builtin.shell: |
        set -o pipefail
        echo {{ root_paths }} | cut -d= -f2 | grep -q ":$" && echo "roots path contains a trailing (:)"
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_root_path_trailing_colon.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_root_path_trailing_colon

    - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Check for owner and permissions"
      when: discovered_root_paths is defined
      block:
        - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Check for owner and permissions"
          ansible.builtin.stat:
            path: "{{ item }}"
          check_mode: false
          register: discovered_root_path_perms
          loop: "{{ discovered_root_paths_split.stdout_lines }}"

        - name: "5.4.2.5 | AUDIT | Ensure root PATH Integrity | Set permissions"
          when:
            - item.stat.exists
            - item.stat.isdir
            - item.stat.pw_name != 'root' or item.stat.gr_name != 'root' or item.stat.woth or item.stat.wgrp
            - (item != 'root') and (not ubtu24cis_uses_root)
          ansible.builtin.file:
            path: "{{ item.stat.path }}"
            state: directory
            owner: root
            group: root
            mode: 'go-w'
            follow: false
          loop: "{{ discovered_root_path_perms.results }}"
          loop_control:
            label: "{{ item }}"

- name: "5.4.2.6 | PATCH | Ensure root user umask is configured"
  when: ubtu24cis_rule_5_4_2_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - shadow_suite
    - rule_5.4.2.6
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.4.2.6 | AUDIT | Ensure root user umask is configured | Check root profile files"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /root/.bash_profile
        - /root/.bashrc
      register: discovered_root_profile_files

    - name: "5.4.2.6 | PATCH | Ensure root user umask is configured | Set umask lines"
      when: item.stat.exists
      ansible.builtin.replace:
        path: "{{ item.item }}"
        regexp: '^(\s*)umask\s+\S+.*$'
        replace: '\1umask {{ ubtu24cis_root_umask }}'
      loop: "{{ discovered_root_profile_files.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: "5.4.2.7 | PATCH | Ensure system accounts do not have a valid login shell"
  when:
    - ubtu24cis_rule_5_4_2_7
    - ubtu24cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - shadow_suite
    - rule_5.4.2.7
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-11
    - NIST800-53R5_MP-2
  block:
    - name: "5.4.2.7 | AUDIT | Ensure system accounts do not have a valid login shell | Find system accounts with a valid shell"
      ansible.builtin.shell: |
        l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' -))$"
        awk -v pat="$l_valid_shells" -v uid_min="{{ min_int_uid }}" -F: '($1 !~ /^(root|halt|sync|shutdown|nfsnobody)$/ && ($3 < uid_min || $3 == 65534) && $NF ~ pat) {print $1}' /etc/passwd
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_system_accounts_valid_shell.rc != 0
      check_mode: false
      register: discovered_system_accounts_valid_shell

    - name: "5.4.2.7 | PATCH | Ensure system accounts do not have a valid login shell | Set shell to nologin"
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /usr/sbin/nologin
        create_home: false
      loop: "{{ discovered_system_accounts_valid_shell.stdout_lines }}"

- name: "5.4.2.8 | PATCH | Ensure accounts without a valid login shell are locked | Lock accounts"
  when:
    - ubtu24cis_rule_5_4_2_8
    - ubtu24cis_disruption_high
    - "item.id not in discovered_interactive_usernames.stdout_lines"
    - "item.id != 'root'"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - shadow_suite
    - rule_5.4.2.8
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-11
    - NIST800-53R5_MP-2
  ansible.builtin.user:
    name: "{{ item.id }}"
    password_lock: true
    create_home: false
  loop: "{{ prelim_captured_passwd_data }}"
  loop_control:
    label: "{{ item.id }}"
