    - patch
    - rule_5.1.23
    - NIST800-53R5_SC-8
    - sshd
  block:
    - name: "5.1.23 | PATCH | Ensure sshd post-quantum cryptography key exchange algorithms are configured | KexAlgorithms"
      when: discovered_sshd_kex_pqc | length > 0
      ansible.builtin.lineinfile:
        path: "{{ ubtu24cis_sshd_cis_conf }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        regexp: (?i)^(#?)\s*KexAlgorithms
        line: "{{ discovered_sshd_kex_line }}"
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: "5.1.23 | WARN | Ensure sshd post-quantum cryptography key exchange algorithms are configured | OpenSSH too old"
      when: discovered_sshd_kex_pqc | length == 0
      ansible.builtin.debug:
        msg: "Warning!! OpenSSH {{ discovered_sshd_version.stdout }} has no post-quantum key exchange algorithm; 8.5 or later is required"

    - name: "5.1.23 | WARN | Ensure sshd post-quantum cryptography key exchange algorithms are configured | OpenSSH too old | warn_count"
      when: discovered_sshd_kex_pqc | length == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.1.23'

- name: "5.1.24 | PATCH | Ensure sshd ListenAddress is configured"
  when: ubtu24cis_rule_5_1_24
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_5.1.24
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - sshd
  block:
    - name: "5.1.24 | PATCH | Ensure sshd ListenAddress is configured | Apply if address configured"
      when: ubtu24cis_sshd_listen_address | length > 0
      ansible.builtin.lineinfile:
        path: "{{ ubtu24cis_sshd_cis_conf }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        regexp: (?i)^(#?)\s*ListenAddress
        line: "ListenAddress {{ ubtu24cis_sshd_listen_address }}"
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: "5.1.24 | PATCH | Ensure sshd ListenAddress is configured | Comment out ListenAddress in sshd_config"
      when: ubtu24cis_sshd_listen_address | length > 0
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: '(?i)^([ \t]*ListenAddress[ \t=].*)$'
        replace: '# \1'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: "5.1.24 | AUDIT | Ensure sshd ListenAddress is configured | Warn if not configured"
      when: ubtu24cis_sshd_listen_address | length == 0
      ansible.builtin.debug:
        msg: "Warning!! ubtu24cis_sshd_listen_address is not set. Set it to a private network interface address to comply with 5.1.24."

    - name: "5.1.24 | WARN | Ensure sshd ListenAddress is configured | Warn Count"
      when: ubtu24cis_sshd_listen_address | length == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.1.24'

- name: "5.1.x | PATCH | Comment out CIS-managed sshd settings above the Include line so the drop-in applies"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sshd
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '(?i)^([ \t]*{{ item.key }}[ \t=].*)$'
    replace: '# \1'
    after: '\A'
    before: '\n[ \t]*Include\s+/etc/ssh/sshd_config\.d/'
    validate: 'sshd -t -f %s'
  loop: "{{ ubtu24cis_sshd_cis_keywords | dict2items | selectattr('value') | list }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart sshd
  vars:
    ubtu24cis_sshd_cis_keywords:
      AllowUsers: "{{ ubtu24cis_rule_5_1_4 and ubtu24cis_sshd_allow_users | default('') | length > 0 }}"
      AllowGroups: "{{ ubtu24cis_rule_5_1_4 and ubtu24cis_sshd_allow_groups | default('') | length > 0 }}"
      DenyUsers: "{{ ubtu24cis_rule_5_1_4 and ubtu24cis_sshd_deny_users | default('') | length > 0 }}"
      DenyGroups: "{{ ubtu24cis_rule_5_1_4 and ubtu24cis_sshd_deny_groups | default('') | length > 0 }}"
      Banner: "{{ ubtu24cis_rule_5_1_5 }}"
      Ciphers: "{{ ubtu24cis_rule_5_1_6 }}"
      ClientAliveInterval: "{{ ubtu24cis_rule_5_1_7 }}"
      ClientAliveCountMax: "{{ ubtu24cis_rule_5_1_7 }}"
      DisableForwarding: "{{ ubtu24cis_rule_5_1_8 }}"
      GSSAPIAuthentication: "{{ ubtu24cis_rule_5_1_9 }}"
      HostbasedAuthentication: "{{ ubtu24cis_rule_5_1_10 }}"
      IgnoreRhosts: "{{ ubtu24cis_rule_5_1_11 }}"
      KexAlgorithms: "{{ ubtu24cis_rule_5_1_12 or (ubtu24cis_rule_5_1_23 and discovered_sshd_kex_pqc | default([]) | length > 0) }}"
      LoginGraceTime: "{{ ubtu24cis_rule_5_1_13 }}"
      LogLevel: "{{ ubtu24cis_rule_5_1_14 }}"
      MACs: "{{ ubtu24cis_rule_5_1_15 }}"
      MaxAuthTries: "{{ ubtu24cis_rule_5_1_16 }}"
      MaxStartups: "{{ ubtu24cis_rule_5_1_17 }}"
      MaxSessions: "{{ ubtu24cis_rule_5_1_18 }}"
      PermitEmptyPasswords: "{{ ubtu24cis_rule_5_1_19 }}"
      PermitRootLogin: "{{ ubtu24cis_rule_5_1_20 }}"
      PermitUserEnvironment: "{{ ubtu24cis_rule_5_1_21 }}"
      UsePAM: "{{ ubtu24cis_rule_5_1_22 }}"
