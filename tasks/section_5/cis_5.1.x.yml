- name: "5.1.12/23 | AUDIT | Set KexAlgorithms from the OpenSSH server version"
  when: ubtu24cis_rule_5_1_12 or ubtu24cis_rule_5_1_23
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - rule_5.1.12
    - rule_5.1.23
    - sshd
  block:
    - name: "5.1.12/23 | AUDIT | Set KexAlgorithms from the OpenSSH server version | Get OpenSSH server version"
      ansible.builtin.shell: |
        set -o pipefail
        sshd -V 2>&1 | grep -oP 'OpenSSH_\K[0-9]+\.[0-9]+'
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_sshd_version.stdout | length == 0
      check_mode: false
      register: discovered_sshd_version

    - name: "5.1.12/23 | AUDIT | Set KexAlgorithms from the OpenSSH server version | Set post-quantum algorithms"
      ansible.builtin.set_fact:
        discovered_sshd_kex_pqc: "{{ ubtu24cis_sshd_kex_pqc_algorithms_openssh_9_9 if discovered_sshd_version.stdout is version('9.9', '>=') else (ubtu24cis_sshd_kex_pqc_algorithms_openssh_8_5 if discovered_sshd_version.stdout is version('8.5', '>=') else []) }}"

    - name: "5.1.12/23 | AUDIT | Set KexAlgorithms from the OpenSSH server version | Set KexAlgorithms line"
      ansible.builtin.set_fact:
        discovered_sshd_kex_line: "KexAlgorithms {{ ((discovered_sshd_kex_pqc if ubtu24cis_rule_5_1_23 else []) + ubtu24cis_sshd_kex_algorithms) | unique | join(',') }}"

