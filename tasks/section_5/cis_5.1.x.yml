---

- name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured"
  when: ubtu24cis_rule_5_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.1
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - sshd
  block:
    - name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: 'u-x,go-rwx'

    - name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured | find conf files"
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        file_type: file
        patterns: '*.conf'
      register: discovered_sshd_confs

    - name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured"
      ansible.builtin.file:
        path: "{{ item.path }}"
        recurse: false
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      loop: "{{ discovered_sshd_confs.files }}"
      loop_control:
        label: "{{ item }}"

- name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured"
  when: ubtu24cis_rule_5_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.2
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - sshd
  block:
    - name: "5.1.2 | AUDIT | Ensure access to SSH private host key files is configured | Find ssh_host private keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key'
      register: discovered_ssh_host_priv_keys

    - name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured | Set permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      with_items:
        - "{{ discovered_ssh_host_priv_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured"
  when: ubtu24cis_rule_5_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.3
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - sshd
  block:
    - name: "5.1.3 | AUDIT | Ensure access to SSH public host key files is configured | Find ssh_host public keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key.pub'
      register: discovered_ssh_host_pub_keys

    - name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured | Set permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      with_items:
        - "{{ discovered_ssh_host_pub_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.x | PATCH | Ensure sshd_config includes sshd_config.d drop-ins"
  when: ubtu24cis_rule_5_1_4 or ubtu24cis_rule_5_1_5 or ubtu24cis_rule_5_1_6 or ubtu24cis_rule_5_1_7 or ubtu24cis_rule_5_1_8 or ubtu24cis_rule_5_1_9 or ubtu24cis_rule_5_1_10 or ubtu24cis_rule_5_1_11 or ubtu24cis_rule_5_1_12 or ubtu24cis_rule_5_1_13 or ubtu24cis_rule_5_1_14 or ubtu24cis_rule_5_1_15 or ubtu24cis_rule_5_1_16 or ubtu24cis_rule_5_1_17 or ubtu24cis_rule_5_1_18 or ubtu24cis_rule_5_1_19 or ubtu24cis_rule_5_1_20 or ubtu24cis_rule_5_1_21 or ubtu24cis_rule_5_1_22 or ubtu24cis_rule_5_1_23 or ubtu24cis_rule_5_1_24
  tags:
    - level1-server
    - level1-workstation
    - patch
    - sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    validate: 'sshd -t -f %s'
  notify: Restart sshd

- name: "5.1.4 | PATCH | Ensure sshd access is configured"
  when: ubtu24cis_rule_5_1_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.4
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - sshd
  block:
    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Ensure /run/sshd exists for sshd -t validation"
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: 'go-w'

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add allowed users"
      when: "ubtu24cis_sshd_allow_users | default('') | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu24cis_sshd_cis_conf }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        regexp: '(?i)^(#?)\s*AllowUsers'
        line: 'AllowUsers {{ ubtu24cis_sshd_allow_users }}'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add allowed groups"
      when: "ubtu24cis_sshd_allow_groups | default('') | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu24cis_sshd_cis_conf }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        regexp: '(?i)^(#?)\s*AllowGroups'
        line: 'AllowGroups {{ ubtu24cis_sshd_allow_groups }}'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add deny users"
      when: "ubtu24cis_sshd_deny_users | default('') | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu24cis_sshd_cis_conf }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        regexp: '(?i)^(#?)\s*DenyUsers'
        line: 'DenyUsers {{ ubtu24cis_sshd_deny_users }}'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add deny groups"
      when: "ubtu24cis_sshd_deny_groups | default('') | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu24cis_sshd_cis_conf }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        regexp: '(?i)^(#?)\s*DenyGroups'
        line: 'DenyGroups {{ ubtu24cis_sshd_deny_groups }}'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

