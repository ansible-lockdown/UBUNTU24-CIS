    create: true
    owner: root
    group: root
    mode: 'u-x,go-rwx'
    regexp: (?i)^(#?)\s*KexAlgorithms
    line: "{{ discovered_sshd_kex_line }}"
    validate: 'sshd -t -f %s'
  notify: Restart sshd

