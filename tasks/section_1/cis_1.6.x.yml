- name: "1.6.4 | PATCH | Ensure pam_motd is configured"
  when: ubtu24cis_rule_1_6_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.6.4
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
    - motd
  block:
    - name: "1.6.4 | AUDIT | Ensure pam_motd is configured | Discover motd files set by pam_motd"
      ansible.builtin.shell: |
        set -o pipefail
        for svc in sshd login su gdm-password; do
          [ -f "/etc/pam.d/$svc" ] && grep -hPi '^\h*session\h+(required|optional)\h+pam_motd\.so\b.*\bmotd=' "/etc/pam.d/$svc" | grep -oP '\bmotd=\K\S+' | tr -d "\"'"
        done | sort -u
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_pam_motd_paths.rc not in [0, 1]
      check_mode: false
      register: discovered_pam_motd_paths

    - name: "1.6.4 | AUDIT | Ensure pam_motd is configured | Discover pam files showing the dynamic motd"
      ansible.builtin.shell: |
        set -o pipefail
        grep -lsP '^\h*session\h+(required|optional)\h+pam_motd\.so\b.*(\bmotd=/run/motd\.dynamic\b|\bnoupdate\b)' /etc/pam.d/sshd /etc/pam.d/login /etc/pam.d/su /etc/pam.d/gdm-password
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_pam_motd_dynamic.rc not in [0, 1, 2]
      check_mode: false
      register: discovered_pam_motd_dynamic

    - name: "1.6.4 | PATCH | Ensure pam_motd is configured | Stop pam_motd showing the dynamic motd and running update-motd"
      when: ubtu24cis_disable_dynamic_motd
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^(\s*session\s+(required|optional)\s+pam_motd\.so\s+(.*\bmotd=/run/motd\.dynamic\b.*|noupdate.*))$'
        replace: '# \1'
      loop: "{{ discovered_pam_motd_dynamic.stdout_lines }}"

    - name: "1.6.4 | PATCH | Ensure pam_motd is configured | Set site motd content in static motd files"
      when: item != '/run/motd.dynamic'
      ansible.builtin.template:
        src: etc/motd.j2
        dest: "{{ item }}"
        mode: 'u-x,go-wx'
      loop: "{{ discovered_pam_motd_paths.stdout_lines }}"

    - name: "1.6.4 | WARN | Ensure pam_motd is configured | Dynamic motd left enabled"
      when:
        - not ubtu24cis_disable_dynamic_motd
        - discovered_pam_motd_dynamic.stdout_lines | length > 0
      ansible.builtin.debug:
        msg: "Warning!! pam_motd shows /run/motd.dynamic, which includes the OS name; set ubtu24cis_disable_dynamic_motd: true or review it against site policy"

    - name: "1.6.4 | WARN | Ensure pam_motd is configured | Dynamic motd left enabled | warn_count"
      when:
        - not ubtu24cis_disable_dynamic_motd
        - discovered_pam_motd_dynamic.stdout_lines | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.6.4'

- name: "1.6.5 | PATCH | Ensure sshd warning Banner is configured"
  when: ubtu24cis_rule_1_6_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.6.5
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
    - banner
    - sshd
  ansible.builtin.template:
    src: etc/issue.net.j2
    dest: "{{ ubtu24cis_sshd_banner_file }}"
    owner: root
    group: root
    mode: 'u-x,go-wx'

- name: "1.6.6 | PATCH | Ensure access to /etc/motd is configured"
  when: ubtu24cis_rule_1_6_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.6.6
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - permissions
    - motd
  ansible.builtin.file:
    path: /etc/motd
    owner: root
    group: root
    mode: 'u-x,go-wx'

