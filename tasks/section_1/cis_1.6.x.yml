---

- name: "1.6.1 | PATCH | Ensure /etc/motd is configured"
  when: ubtu24cis_rule_1_6_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.6.1
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
    - motd
  block:
    - name: "1.6.1 | PATCH | Ensure /etc/motd is configured | motd"
      ansible.builtin.template:
        src: etc/motd.j2
        dest: /etc/motd
        mode: 'u-x,go-wx'

