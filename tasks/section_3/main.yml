---

- name: "SECTION | 3.1 | Configure Network Devices"
  ansible.builtin.import_tasks:
    file: cis_3.1.x.yml

- name: "SECTION | 3.2 | Configure Network Kernel Modules"
  ansible.builtin.import_tasks:
    file: cis_3.2.x.yml

- name: "SECTION | 3.3 | Comment out conflicting network kernel parameters"
  ansible.builtin.import_tasks:
    file: cis_3.3.x.yml

- name: "SECTION | 3.3.1 | Configure IPv4 parameters"
  ansible.builtin.import_tasks:
    file: cis_3.3.1.x.yml

- name: "SECTION | 3.3.2 | Configure IPv6 parameters"
  when: ubtu24cis_ipv6_required
  ansible.builtin.import_tasks:
    file: cis_3.3.2.x.yml
