---

- name: "6.3.1 | PATCH | Ensure AIDE is installed"
  when:
    - ubtu24cis_rule_6_3_1
    - ubtu24cis_config_aide
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.3.1
    - aide
  block:
    - name: "6.3.1 | PATCH | Ensure AIDE is installed"
      when: "'aide' not in ansible_facts['packages'] or 'aide-common' not in ansible_facts['packages']"
      ansible.builtin.package:
        name: ['aide', 'aide-common']
        state: present
        update_cache: true
        install_recommends: false
        lock_timeout: "{{ ubtu24cis_apt_lock_timeout }}"
      register: discovered_aide_pkgs_added

    - name: "6.3.1 | PATCH | Ensure AIDE is installed | Recapture packages"
      when: discovered_aide_pkgs_added.skipped is not defined
      ansible.builtin.package_facts:
        manager: auto

    - name: "6.3.1 | AUDIT | Ensure AIDE is installed | Check file exists"
      ansible.builtin.stat:
        path: "{{ ubtu24cis_aide_db_file }}"
      register: discovered_aide_db_file

    - name: "6.3.1 | AUDIT | Ensure AIDE is installed | Check current db file age"
      when: discovered_aide_db_file.stat.exists
      ansible.builtin.find:
        path: "{{ ubtu24cis_aide_db_file | dirname }}"
        pattern: "{{ ubtu24cis_aide_db_file | basename }}"
        age: "{{ ubtu24cis_aide_db_file_age }}"
      register: discovered_aide_db_age

    - name: "6.3.1 | PATCH | Ensure AIDE is installed | Configure AIDE"
      when:
        - not ansible_check_mode
        - not discovered_aide_db_file.stat.exists or
          (discovered_aide_db_age.files | length > 0) or
          ubtu24cis_aide_db_recreate
      block:
        - name: "6.3.1 | PATCH | Ensure AIDE is installed | Remove current db file"
          ansible.builtin.file:
            path: "{{ ubtu24cis_aide_db_file }}"
            state: absent

        - name: "6.3.1 | PATCH | Ensure AIDE is installed | Configure AIDE"
          when: not ansible_check_mode
          ansible.builtin.command: "{{ aide_initiate_command }}"
          changed_when: true
          args:
            creates: "{{ ubtu24cis_aide_db_file }}"
          async: "{{ ubtu24cis_aide_init_async }}"
          poll: "{{ ubtu24cis_aide_init_poll }}"

    - name: "6.3.1 | PATCH | Ensure AIDE is installed | Ensure AIDE logfiles have the appropriate permissions"
      block:
        - name: "6.3.1 | AUDIT | Ensure AIDE is installed | Ensure AIDE logfiles have the appropriate permissions | Find AIDE logfiles"
          ansible.builtin.find:
            paths: /var/log/aide
            patterns: "*.log"
          check_mode: false
          register: discovered_aide_logfiles

        - name: "6.3.1 | PATCH | Ensure AIDE is installed | Ensure AIDE logfiles have the appropriate permissions | Apply the permissions"
          ansible.builtin.file:
            path: "{{ item.path }}"
            mode: 'u-x,g-wx,o-rwx'
          loop: "{{ discovered_aide_logfiles.files }}"
          loop_control:
            label: "{{ item }}"
          failed_when: discovered_aide_file_exists.state not in '[ file, absent ]'
          register: discovered_aide_file_exists

- name: "6.3.2 | PATCH | Ensure filesystem integrity is regularly checked"
  when:
    - ubtu24cis_config_aide
    - ubtu24cis_rule_6_3_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.3.2
    - NIST800-53R5_AU-2
    - aide
  vars:
    warn_control_id: '6.3.2'
  block:
    - name: "6.3.2 | AUDIT | Ensure filesystem integrity is regularly checked | Discover cron jobs added by earlier role runs"
      ansible.builtin.shell: "grep -lsx '#Ansible: Run AIDE integrity check' /etc/cron.d/*"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_aide_role_cron

    - name: "6.3.2 | PATCH | Ensure filesystem integrity is regularly checked | Remove cron jobs added by earlier role runs"
      ansible.builtin.cron:
        name: Run AIDE integrity check
        cron_file: "{{ item }}"
        user: root
        state: absent
      loop: "{{ discovered_aide_role_cron.stdout_lines }}"

    - name: "6.3.2 | AUDIT | Ensure filesystem integrity is regularly checked | Discover unit overrides written by earlier role runs"
      ansible.builtin.command: grep -lsx '# File managed by ansible as part of {{ benchmark }} benchmark' /etc/systemd/system/dailyaidecheck.service /etc/systemd/system/dailyaidecheck.timer
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_aide_role_units

    - name: "6.3.2 | PATCH | Ensure filesystem integrity is regularly checked | Remove unit overrides written by earlier role runs"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ discovered_aide_role_units.stdout_lines }}"
      register: discovered_aide_role_units_removed

    - name: "6.3.2 | PATCH | Ensure filesystem integrity is regularly checked | Timer drop-in directory"
      ansible.builtin.file:
        path: /etc/systemd/system/dailyaidecheck.timer.d
        state: directory
        owner: root
        group: root
        mode: 'u=rwx,go=rx'

    - name: "6.3.2 | PATCH | Ensure filesystem integrity is regularly checked | Timer schedule"
      ansible.builtin.template:
        src: etc/systemd/system/dailyaidecheck.timer.d/ubtu24cis_schedule.conf.j2
        dest: /etc/systemd/system/dailyaidecheck.timer.d/ubtu24cis_schedule.conf
        owner: root
        group: root
        mode: 'u-x,go-wx'
      register: discovered_aide_timer_schedule

    - name: "6.3.2 | PATCH | Ensure filesystem integrity is regularly checked | Unmask service"
      ansible.builtin.systemd:
        name: dailyaidecheck.service
        masked: false
        daemon_reload: "{{ discovered_aide_role_units_removed is changed or discovered_aide_timer_schedule is changed }}"

    - name: "6.3.2 | PATCH | Ensure filesystem integrity is regularly checked | Unmask, enable and start timer"
      ansible.builtin.systemd:
        name: dailyaidecheck.timer
        masked: false
        enabled: true
        state: started

    - name: "6.3.2 | AUDIT | Ensure filesystem integrity is regularly checked | Discover other cron jobs running AIDE"
      ansible.builtin.shell: grep -lsE '^[^#]*/aide[[:space:]]' /etc/crontab /etc/cron.d/* /var/spool/cron/crontabs/*
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_aide_other_cron

    - name: "6.3.2 | AUDIT | Ensure filesystem integrity is regularly checked | Warn on other cron jobs running AIDE"
      when: discovered_aide_other_cron.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! AIDE also runs from cron in the files below as well as from dailyaidecheck.timer. Remove the cron job if the timer is the only scheduler wanted"
          - "{{ discovered_aide_other_cron.stdout_lines }}"

    - name: "6.3.2 | WARNING | Ensure filesystem integrity is regularly checked | warn_count"
      when: discovered_aide_other_cron.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "6.3.3 | PATCH | Ensure cryptographic mechanisms are used to protect the integrity of audit tools"
  when:
    - ubtu24cis_rule_6_3_3
    - ubtu24cis_config_aide
  tags:
    - level2-server
    - level2-workstation
    - automated
    - aide
    - file_integrity
    - patch
    - rule_6.3.3
    - NIST800-53R5_NA
  ansible.builtin.blockinfile:
    path: /etc/aide/aide.conf
    marker: "# {mark} Audit tools - CIS benchmark - Ansible-lockdown"
    block: |
      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
      /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
    validate: aide -D --config %s
