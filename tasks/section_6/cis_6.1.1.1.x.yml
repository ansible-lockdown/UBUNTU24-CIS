---

- name: "6.1.1.1.1 | PATCH | Ensure journald service is active"
  when: ubtu24cis_rule_6_1_1_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - patch
    - journald
    - rule_6.1.1.1.1
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: systemd-journald.service
    masked: false
    state: started
    enabled: true

- name: "6.1.1.1.2 | PATCH | Ensure systemd-journal-remote service is not in use"
  when:
    - not ubtu24cis_system_is_log_server
    - ubtu24cis_rule_6_1_1_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - journald
    - rule_6.1.1.1.2
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ ('systemd-journal-remote' in ansible_facts['packages']) | ternary(false, omit) }}"
    state: "{{ ('systemd-journal-remote' in ansible_facts['packages']) | ternary('stopped', omit) }}"
    masked: true
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service
  loop_control:
    label: "{{ item }}"

- name: "6.1.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog"
  when:
    - ubtu24cis_rule_6_1_1_1_3
    - ubtu24cis_syslog_service == 'rsyslog'
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - journald
    - rule_6.1.1.1.3
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-4
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
  block:
    - name: "6.1.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog | journald.conf"
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^\s*#?\s*ForwardToSyslog\s*='
        line: ForwardToSyslog=yes
      notify:
        - Restart journald
        - Restart syslog service

    - name: "6.1.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog | conf.d directory"
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: 'u+x,go-w'

    - name: "6.1.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog | drop-in sorted last"
      ansible.builtin.copy:
        content: |
          [Journal]
          ForwardToSyslog=yes
        dest: /etc/systemd/journald.conf.d/zz-forward-to-syslog.conf
        owner: root
        group: root
        mode: 'u-x,g-wx,o-rwx'
      notify:
        - Restart journald
        - Restart syslog service

- name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured"
  when: ubtu24cis_rule_6_1_1_1_4
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - journald
    - rule_6.1.1.1.4
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
    - NIST800-53R5_SI-5
  block:
    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | Check for override file"
      ansible.builtin.stat:
        path: /etc/tmpfiles.d/systemd.conf
      register: discovered_journald_tmpfile_override

    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | If override file check for journal"
      when: discovered_journald_tmpfile_override.stat.exists
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^z /var/log/journal/%m/system.journal [0-9]+' /etc/tmpfiles.d/systemd.conf
      args:
        executable: "{{ ubtu24cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_journald_fileperms_override.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_journald_fileperms_override

    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | Warning if override found"
      when:
        - discovered_journald_tmpfile_override.stat.exists
        - discovered_journald_fileperms_override.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! - tmpfiles override /etc/tmpfiles.d/systemd.conf sets the journal file mode, please confirm it is 0640 or site policy"

    - name: "6.1.1.1.4 | AUDIT | Ensure journald log file access is configured | Warning if override found"
      when:
        - discovered_journald_tmpfile_override.stat.exists
        - discovered_journald_fileperms_override.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '6.1.1.1.4'

- name: "6.1.1.1.5/6/7 | PATCH | Create journald conf.d directory"
  when:
    - ubtu24cis_rule_6_1_1_1_5 or
      ubtu24cis_rule_6_1_1_1_6 or
      ubtu24cis_rule_6_1_1_1_7
  tags:
    - level1-server
    - level1-workstation
    - patch
    - journald
    - rule_6.1.1.1.5
    - rule_6.1.1.1.6
    - rule_6.1.1.1.7
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: 'u+x,go-w'

- name: "6.1.1.1.5 | PATCH | Ensure journald log file rotation is configured"
  when: ubtu24cis_rule_6_1_1_1_5
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - journald
    - rule_6.1.1.1.5
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  block:
    - name: "6.1.1.1.5 | PATCH | Ensure journald log file rotation is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/rotation.conf.j2
        dest: /etc/systemd/journald.conf.d/rotation.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'
      notify: Restart journald

    - name: "6.1.1.1.5 | PATCH | Ensure journald log file rotation is configured | comment out current entries"
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: "{{ item }}"
        replace: '#\1'
      notify: Restart journald
      loop:
        - '^(\s*SystemMaxUse\s*=.*)'
        - '^(\s*SystemKeepFree\s*=.*)'
        - '^(\s*RuntimeMaxUse\s*=)'
        - '^(\s*RuntimeKeepFree\s*=.*)'
        - '^(\s*MaxFileSec\s*=.*)'
      loop_control:
        label: "{{ item }}"

- name: "6.1.1.1.6 | PATCH | Ensure journald Storage is configured"
  when: ubtu24cis_rule_6_1_1_1_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - journald
    - rule_6.1.1.1.6
  block:
    - name: "6.1.1.1.6 | PATCH | Ensure journald Storage is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/storage.conf.j2
        dest: /etc/systemd/journald.conf.d/storage.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'
      notify: Restart journald

    - name: "6.1.1.1.6 | PATCH | Ensure journald Storage is configured | comment out current entries"
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: (?i)^(\s*storage=)
        replace: '#\1'
      notify: Restart journald

- name: "6.1.1.1.7 | PATCH | Ensure journald Compress is configured"
  when: ubtu24cis_rule_6_1_1_1_7
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - journald
    - rule_6.1.1.1.7
  block:
    - name: "6.1.1.1.7 | PATCH | Ensure journald Compress is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/storage.conf.j2
        dest: /etc/systemd/journald.conf.d/storage.conf
        owner: root
        group: root
        mode: 'g-wx,o-rwx'
      notify: Restart journald

    - name: "6.1.1.1.7 | PATCH | Ensure journald Compress is configured | comment out current entries"
      ansible.builtin.replace:
        path: /etc/systemd/journald.conf
        regexp: (?i)^(\s*compress=)
        replace: '#\1'
      notify: Restart journald
